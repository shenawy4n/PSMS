name: Deploy create-employee Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/create-employee/**"
      - ".github/workflows/deploy-create-employee.yml"

permissions:
  contents: read

concurrency:
  group: deploy-create-employee
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: gygksvqqqtjqgcnwfjha
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secret
        shell: bash
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            echo "Add it in Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy create-employee function
        run: supabase functions deploy create-employee --project-ref "${SUPABASE_PROJECT_REF}"
