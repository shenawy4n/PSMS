name: Deploy create-employee Edge Function

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/create-employee/**'
      - '.github/workflows/deploy-create-employee.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Edge Function to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.145.4

      - name: Deploy create-employee Edge Function
        run: |
          supabase functions deploy create-employee --project-ref gygksvqqqtjqgcnwfjha
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
